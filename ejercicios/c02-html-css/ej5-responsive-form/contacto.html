<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi CV - Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Maximo Villaverde</h1>
        <p class="subtitulo">Estudiante de Desarrollo de Software · UTN FRLP</p>
    </header>

    <nav class="navegacion">
        <a href="index.html">Inicio</a>
        <a href="estudios.html">Estudios</a>
        <a href="experiencia.html">Experiencia</a>
        <a href="hobbies.html">Hobbies</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section class="tarjeta">
            <h2>Contactame</h2>
            <form class="formulario">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required minlength="3">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>

                <label for="telefono">Teléfono</label>
                <input type="number" id="telefono" placeholder="Tu número de teléfono">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5" placeholder="Escribí tu mensaje acá..." required minlength="10"></textarea>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Maximo Villaverde</p>
    </footer>

</body>
</html>
